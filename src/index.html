<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GIGA-CLASH</title>
<style>
html,body{margin:0;height:100%;background:#070912;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100%}
#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;outline:none}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe9a8;font:bold 18px "Hiragino Sans","Noto Sans JP",sans-serif;text-align:center;padding:24px;pointer-events:none}
#rot{display:none;position:fixed;inset:0;background:rgba(7,9,18,.94);color:#ffe9a8;font:bold 20px "Hiragino Sans","Noto Sans JP",sans-serif;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;z-index:5}
#rot .ic{font-size:56px;animation:r 1.6s ease-in-out infinite}
#rot small{color:#9fb2e6;font-weight:normal;font-size:14px}
@keyframes r{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
@media (orientation:portrait) and (pointer:coarse){#rot.on{display:flex}}
</style>
</head>
<body>
<div id="wrap"><div id="stage"><canvas id="gl"></canvas><canvas id="ui" tabindex="0"></canvas></div></div>
<div id="msg">読み込み中…</div>
<div id="rot" class="on"><div class="ic">📱</div><div>スマホを横向きにすると<br>大きく遊べます</div><small>タップでこのまま遊ぶ</small></div>
<script type="module" src="./main.js"></script>
</body>
</html>
