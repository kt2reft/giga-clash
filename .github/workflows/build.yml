# src/ や package.json を変更して push すると、自動で docs/ を作り直して公開する
name: build
on:
  push:
    branches: [main]
    paths: ['src/**', 'tools/**', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run sim -- 20
      - run: npm run build
      - name: docs/ を更新してコミット
        run: |
          if git diff --quiet -- docs/index.html; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "docs: 自動ビルド ver $(node -p "require('./package.json').version")"
          git push
